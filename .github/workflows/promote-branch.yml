name: Promote Branch

on:
  workflow_dispatch:
    inputs:
      path:
        description: Promotion path
        type: choice
        required: true
        options:
          - master -> stage
          - stage -> prod
          - master -> prod

permissions:
  contents: write

concurrency:
  group: promote-branch-${{ github.event.inputs.path }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0

      - name: Promote branch
        env:
          PROMOTION_PATH: ${{ github.event.inputs.path }}
        run: |
          set -euo pipefail
          case "$PROMOTION_PATH" in
            "master -> stage")
              SOURCE=master
              TARGET=stage
              ;;
            "stage -> prod")
              SOURCE=stage
              TARGET=prod
              ;;
            "master -> prod")
              SOURCE=master
              TARGET=prod
              ;;
            *)
              echo "Unknown promotion path: $PROMOTION_PATH"
              exit 1
              ;;
          esac
          echo "Promoting $SOURCE -> $TARGET"
          git fetch origin "refs/heads/$SOURCE"
          git push origin "FETCH_HEAD:refs/heads/$TARGET"
