name: Deploy Studio

on:
  workflow_dispatch:
    inputs:
      deploy_schema:
        description: Deploy schema to the registry
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4.4.0

      - uses: actions/setup-node@v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Authenticate with Sanity
        run: echo "$SANITY_AUTH_TOKEN" | npx sanity login --with-token
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}

      - name: Deploy schema to registry
        if: inputs.deploy_schema == 'true'
        run: npx sanity schemas deploy
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}

      - name: Deploy Studio
        run: npx sanity deploy --yes --schema-required
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
