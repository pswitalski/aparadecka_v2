name: Deploy Web

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        type: choice
        required: true
        default: master
        options: [master, stage, prod]
  repository_dispatch:
    types: [content-rebuild]

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Resolve branch
        id: branch
        working-directory: .
        run: |
          set -euo pipefail
          allowed="master stage prod"
          branch=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            branch="${{ inputs.branch }}"
          else
            branch="${{ github.event.client_payload.branch }}"
            if [ -z "$branch" ]; then
              branch="master"
              echo "::warning::content-rebuild payload had no 'branch'; defaulting to master"
            fi
          fi
          case " $allowed " in
            *" $branch "*) ;;
            *) echo "::error::unrecognized branch '$branch' (allowed: $allowed)"; exit 1 ;;
          esac
          echo "BRANCH=$branch" >> "$GITHUB_OUTPUT"

      - name: Report deploy started
        id: started
        working-directory: .
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
          SANITY_PROJECT_ID: ${{ vars.PUBLIC_SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ vars.PUBLIC_SANITY_DATASET }}
        run: |
          if [ -z "$SANITY_API_TOKEN" ]; then echo "Skipping status report (no SANITY_API_TOKEN)"; exit 0; fi
          if [ -z "$SANITY_PROJECT_ID" ] || [ -z "$SANITY_DATASET" ]; then
            echo "::warning::missing PUBLIC_SANITY_PROJECT_ID / PUBLIC_SANITY_DATASET; skipping status report"
            exit 0
          fi
          BRANCH="${{ steps.branch.outputs.BRANCH }}"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "STARTED_AT=$NOW" >> "$GITHUB_OUTPUT"
          API_URL="https://${SANITY_PROJECT_ID}.api.sanity.io/v2021-06-07/data/mutate/${SANITY_DATASET}"
          PAYLOAD="$(jq -nc --arg id "deploy.run.${BRANCH}" --arg branch "$BRANCH" --arg now "$NOW" '{mutations:[{createOrReplace:{_id:$id,_type:"deploy.run",branch:$branch,status:"in_progress",startedAt:$now,updatedAt:$now}}]}')"
          curl -sS -X POST "$API_URL" \
            -H "Authorization: Bearer ${SANITY_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary "$PAYLOAD"

      - uses: actions/checkout@v4.4.0
        with:
          ref: ${{ steps.branch.outputs.BRANCH }}

      - uses: actions/setup-node@v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify required build vars
        run: |
          missing=""
          for name in PUBLIC_SANITY_PROJECT_ID PUBLIC_SANITY_DATASET PUBLIC_TURNSTILE_SITE_KEY; do
            eval "value=\${$name:-}"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required build vars:$missing"
            exit 1
          fi
        env:
          PUBLIC_SANITY_PROJECT_ID: ${{ vars.PUBLIC_SANITY_PROJECT_ID }}
          PUBLIC_SANITY_DATASET: ${{ vars.PUBLIC_SANITY_DATASET }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}

      - name: Build
        run: npm run build
        env:
          PUBLIC_SANITY_PROJECT_ID: ${{ vars.PUBLIC_SANITY_PROJECT_ID }}
          PUBLIC_SANITY_DATASET: ${{ vars.PUBLIC_SANITY_DATASET }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
          PUBLIC_SITE_ENV: ${{ steps.branch.outputs.BRANCH == 'prod' && 'production' || 'preview' }}

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=aparadecka-v2 --branch=${{ steps.branch.outputs.BRANCH }}
          workingDirectory: web
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Print deployment URL
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: echo "Deployed to $DEPLOYMENT_URL"

      - name: Report deploy result
        if: always()
        working-directory: .
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
          SANITY_PROJECT_ID: ${{ vars.PUBLIC_SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ vars.PUBLIC_SANITY_DATASET }}
        run: |
          if [ -z "$SANITY_API_TOKEN" ]; then echo "Skipping status report (no SANITY_API_TOKEN)"; exit 0; fi
          if [ -z "$SANITY_PROJECT_ID" ] || [ -z "$SANITY_DATASET" ]; then
            echo "::warning::missing PUBLIC_SANITY_PROJECT_ID / PUBLIC_SANITY_DATASET; skipping status report"
            exit 0
          fi
          BRANCH="${{ steps.branch.outputs.BRANCH }}"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          RUN_URL="https://github.com/pswitalski/aparadecka_v2/actions/runs/${{ github.run_id }}"
          STATUS="failed"
          MESSAGE="The deploy workflow failed. Check GitHub Actions: ${RUN_URL}"
          DEPLOY_URL=""
          if [ "${{ steps.deploy.outcome }}" = "success" ]; then
            STATUS="success"
            DEPLOY_URL="${{ steps.deploy.outputs.pages-deployment-alias-url }}"
            MESSAGE=""
          fi
          API_URL="https://${SANITY_PROJECT_ID}.api.sanity.io/v2021-06-07/data/mutate/${SANITY_DATASET}"
          PAYLOAD="$(jq -nc --arg id "deploy.run.${BRANCH}" --arg branch "$BRANCH" --arg status "$STATUS" --arg message "$MESSAGE" --arg deployUrl "$DEPLOY_URL" --arg startedAt "${{ steps.started.outputs.STARTED_AT }}" --arg now "$NOW" '{mutations:[{createOrReplace:{_id:$id,_type:"deploy.run",branch:$branch,status:$status,message:$message,deployUrl:$deployUrl,startedAt:$startedAt,updatedAt:$now}}]}')"
          curl -sS -X POST "$API_URL" \
            -H "Authorization: Bearer ${SANITY_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary "$PAYLOAD"